name: Deploy DEV

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  deploy:
    name: Liquibase Deploy - DEV
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Liquibase
        run: |
          curl -L https://github.com/liquibase/liquibase/releases/download/v5.0.1/liquibase-5.0.1.tar.gz -o liquibase.tar.gz
          tar -xzf liquibase.tar.gz
          chmod +x liquibase
          echo "$PWD" >> $GITHUB_PATH

      - name: Verify Liquibase
        run: |
          liquibase --version

      - name: Install Snowflake Extension
        run: |
          liquibase lpm update
          liquibase lpm install snowflake

      - name: Download Snowflake JDBC Driver
        run: |
          mkdir -p liquibase/lib
          curl -L \
          https://repo1.maven.org/maven2/net/snowflake/snowflake-jdbc/3.25.1/snowflake-jdbc-3.25.1.jar \
          -o liquibase/lib/snowflake-jdbc.jar

      - name: Liquibase Status
        working-directory: sql/ddl
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          liquibase \
            --classpath=../../liquibase/lib/snowflake-jdbc.jar \
            --defaults-file=liquibase.properties \
            status

      - name: Liquibase Update
        working-directory: sql/ddl
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: |
          liquibase \
            --classpath=../../liquibase/lib/snowflake-jdbc.jar \
            --defaults-file=liquibase.properties \
            update