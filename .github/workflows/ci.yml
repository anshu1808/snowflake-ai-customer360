name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Unit + SQL logic tests
        run: pytest

  repo-checks:
    name: Repo guard-rails (changelog, SQL syntax, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate repository
        run: python -m src.tools.validate_repo

  ddl-immutability:
    name: Deployed changesets must not be edited
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'allow-ddl-edit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if existing DDL files were modified, renamed or deleted
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- sql/ddl \
                    | grep -E '\.sql$' || true)
          if [ -n "$changed" ]; then
            echo "::error::These already-merged changesets were modified. Liquibase will fail with a checksum error. Add a NEW changeset instead (or add the 'allow-ddl-edit' label for a non-prod reset)."
            echo "$changed"
            exit 1
          fi
          echo "No existing changesets modified."
